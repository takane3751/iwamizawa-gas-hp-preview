<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="雪の夜、窓の外は雪景色。キッチンのガスコンロで鍋が湯気を立てている、あたたかな家の中。">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBEFE2"/><stop offset="1" stop-color="#F6E1CC"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B4A5A"/><stop offset="1" stop-color="#5E7F8E"/></linearGradient>
    <radialGradient id="lamp" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#FFE3B8" stop-opacity=".9"/><stop offset="1" stop-color="#FFE3B8" stop-opacity="0"/></radialGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A6550"/><stop offset="1" stop-color="#0F4C3A"/></linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C95A1E"/><stop offset=".5" stop-color="#E5732B"/><stop offset="1" stop-color="#B9541A"/></linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2E6FD0"/><stop offset="1" stop-color="#8EC5FF"/></linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1000" height="800" fill="url(#wall)"/>
  <!-- 窓 -->
  <g transform="translate(470 90)">
    <rect x="0" y="0" width="420" height="300" rx="18" fill="#FFFFFF"/>
    <rect x="16" y="16" width="388" height="268" rx="10" fill="url(#night)"/>
    <path d="M16 220 C120 196 220 214 310 200 S390 196 404 204 V284 H16Z" fill="#E8F0F3"/>
    <g fill="#1F3A47" opacity=".8">
      <path d="M70 214 L92 160 L114 214Z"/><path d="M300 206 L318 162 L336 206Z"/><path d="M340 208 L354 176 L368 208Z"/>
    </g>
    <g fill="#FFC985"><rect x="190" y="182" width="12" height="10" rx="2"/><rect x="214" y="182" width="12" height="10" rx="2"/></g>
    <path d="M178 196 L208 168 L238 196Z" fill="#1F3A47"/><rect x="182" y="194" width="52" height="22" fill="#1F3A47"/>
    <g fill="#FFFFFF"><circle cx="60" cy="60" r="3"/><circle cx="130" cy="110" r="2.4"/><circle cx="210" cy="48" r="2.8"/><circle cx="270" cy="120" r="2"/><circle cx="350" cy="70" r="3"/><circle cx="380" cy="140" r="2.2"/><circle cx="100" cy="170" r="2"/><circle cx="240" cy="160" r="2.4"/></g>
    <rect x="206" y="16" width="8" height="268" fill="#FFFFFF"/>
    <rect x="16" y="146" width="388" height="8" fill="#FFFFFF"/>
  </g>
  <!-- ペンダントライト -->
  <line x1="250" y1="0" x2="250" y2="130" stroke="#0F4C3A" stroke-width="3"/>
  <path d="M200 170 Q250 110 300 170Z" fill="#0F4C3A"/>
  <ellipse cx="250" cy="300" rx="220" ry="200" fill="url(#lamp)"/>
  <!-- 棚 -->
  <rect x="60" y="250" width="300" height="12" rx="3" fill="#E1C6A8"/>
  <g transform="translate(80 196)"><rect x="0" y="0" width="40" height="54" rx="6" fill="#FFFFFF"/><rect x="54" y="14" width="34" height="40" rx="6" fill="#2F8068"/><rect x="104" y="6" width="44" height="48" rx="22" fill="#E5732B" opacity=".85"/><rect x="164" y="20" width="26" height="34" rx="5" fill="#FFFFFF"/><path d="M220 54 V18 Q236 0 252 18 V54Z" fill="#7BAA8F"/></g>
  <!-- カウンター -->
  <rect x="0" y="560" width="1000" height="240" fill="url(#counter)"/>
  <rect x="0" y="548" width="1000" height="18" fill="#F2F4F3"/>
  <!-- コンロ -->
  <g transform="translate(330 500)">
    <rect x="0" y="40" width="360" height="30" rx="8" fill="#22302B"/>
    <rect x="20" y="70" width="320" height="14" rx="4" fill="#2C3C36"/>
    <g fill="#E5732B"><circle cx="60" cy="78" r="5"/><circle cx="300" cy="78" r="5"/></g>
    <!-- 炎 -->
    <g fill="url(#flame)">
      <path d="M220 40 q6 -16 10 0z"/><path d="M234 40 q6 -18 10 0z"/><path d="M248 40 q6 -16 10 0z"/><path d="M262 40 q6 -18 10 0z"/><path d="M276 40 q6 -16 10 0z"/>
    </g>
    <!-- 鍋 -->
    <g transform="translate(196 -70)">
      <path d="M0 40 H120 V96 Q120 112 104 112 H16 Q0 112 0 96Z" fill="url(#pot)"/>
      <rect x="-12" y="36" width="144" height="12" rx="6" fill="#B9541A"/>
      <rect x="-30" y="56" width="24" height="10" rx="5" fill="#8C3E12"/><rect x="126" y="56" width="24" height="10" rx="5" fill="#8C3E12"/>
      <path d="M30 30 Q60 10 90 30" fill="none" stroke="#8C3E12" stroke-width="8" stroke-linecap="round"/>
    </g>
    <!-- やかん -->
    <g transform="translate(36 -40)">
      <path d="M10 80 Q0 40 40 30 H70 Q110 40 100 80Z" fill="#FFFFFF"/>
      <path d="M100 60 L132 40" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
      <path d="M30 30 Q55 0 80 30" fill="none" stroke="#1F2A26" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
  <!-- 湯気 -->
  <g fill="#FFFFFF" opacity=".85" filter="url(#blur)">
    <ellipse cx="460" cy="400" rx="26" ry="18"/><ellipse cx="480" cy="360" rx="32" ry="20"/><ellipse cx="460" cy="316" rx="36" ry="22"/><ellipse cx="490" cy="270" rx="34" ry="20"/>
  </g>
  <g fill="#FFFFFF" opacity=".7">
    <circle cx="470" cy="392" r="10"/><circle cx="482" cy="360" r="13"/><circle cx="468" cy="324" r="15"/><circle cx="488" cy="286" r="13"/>
  </g>
  <!-- マグ -->
  <g transform="translate(780 480)"><rect x="0" y="10" width="60" height="68" rx="10" fill="#FFFFFF"/><path d="M60 26 Q84 26 84 44 Q84 62 60 62" fill="none" stroke="#FFFFFF" stroke-width="9"/><rect x="0" y="30" width="60" height="10" fill="#E5732B"/></g>
  <g transform="translate(120 486)"><rect x="0" y="0" width="120" height="70" rx="12" fill="#F7E9DA"/><circle cx="34" cy="30" r="16" fill="#E5732B" opacity=".8"/><circle cx="74" cy="34" r="18" fill="#2F8068" opacity=".75"/></g>
</svg>
