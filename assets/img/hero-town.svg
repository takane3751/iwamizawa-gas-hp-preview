<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMax slice" width="1600" height="700" role="img" aria-label="夕暮れの岩見沢のまち。雪の丘と、あかりの灯る家々。">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A230F"/>
      <stop offset=".35" stop-color="#8C4A1E"/>
      <stop offset=".65" stop-color="#C96A26"/>
      <stop offset="1" stop-color="#F0B24D"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF3D6"/>
      <stop offset=".5" stop-color="#F7C56A" stop-opacity=".9"/>
      <stop offset="1" stop-color="#F0B24D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snowFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3D9B8"/><stop offset="1" stop-color="#D9A876"/>
    </linearGradient>
    <linearGradient id="snowMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9E6CC"/><stop offset="1" stop-color="#E3B58A"/>
    </linearGradient>
    <linearGradient id="snowNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4E4"/><stop offset="1" stop-color="#F1D2AF"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/><stop offset="1" stop-color="#F5B341"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#sky)"/>
  <circle cx="1180" cy="330" r="190" fill="url(#sun)"/>
  <!-- 遠景の丘（夕張山地） -->
  <path d="M0 420 C200 360 380 400 560 370 S900 330 1100 360 S1400 380 1600 350 V700 H0Z" fill="#6E3A1B" opacity=".55"/>
  <path d="M0 470 C180 420 360 460 540 430 S880 390 1080 425 S1380 445 1600 410 V700 H0Z" fill="url(#snowFar)" opacity=".85"/>
  <!-- 中景の雪の丘 -->
  <path d="M0 540 C220 490 420 530 640 505 S1000 470 1240 510 S1480 540 1600 515 V700 H0Z" fill="url(#snowMid)"/>
  <!-- 家並み（あかりが灯る） -->
  <g id="houses" fill="#3F2A1E">
    <!-- house 1 -->
    <g transform="translate(180 470)">
      <path d="M0 40 L45 0 L90 40 V110 H0Z"/><rect x="0" y="40" width="90" height="70"/>
      <rect x="14" y="58" width="18" height="20" fill="url(#win)"/><rect x="58" y="58" width="18" height="20" fill="url(#win)"/>
      <rect x="62" y="6" width="10" height="26" fill="#2B1B12"/>
    </g>
    <g transform="translate(300 495)">
      <path d="M0 30 L35 0 L70 30 V90 H0Z"/><rect x="0" y="30" width="70" height="60"/>
      <rect x="10" y="44" width="14" height="18" fill="url(#win)"/><rect x="44" y="44" width="14" height="18" fill="url(#win)"/>
    </g>
    <!-- 教会風の尖塔（岩見沢の街並みのアクセント） -->
    <g transform="translate(560 440)">
      <path d="M0 60 L40 0 L80 60 V140 H0Z"/><rect x="0" y="60" width="80" height="80"/>
      <rect x="30" y="-40" width="20" height="60" fill="#3F2A1E"/><path d="M28 -40 L40 -70 L52 -40Z" fill="#3F2A1E"/>
      <rect x="32" y="80" width="16" height="30" rx="8" fill="url(#win)"/>
      <rect x="10" y="80" width="12" height="20" fill="url(#win)"/><rect x="58" y="80" width="12" height="20" fill="url(#win)"/>
    </g>
    <g transform="translate(680 490)">
      <path d="M0 34 L40 0 L80 34 V96 H0Z"/><rect x="0" y="34" width="80" height="62"/>
      <rect x="12" y="50" width="16" height="20" fill="url(#win)"/><rect x="50" y="50" width="16" height="20" fill="url(#win)"/>
    </g>
    <!-- サイロ・穀倉（農業のまち） -->
    <g transform="translate(900 450)">
      <rect x="0" y="40" width="56" height="130" rx="6"/><path d="M0 40 A28 28 0 0 1 56 40Z"/>
      <rect x="20" y="70" width="16" height="14" rx="3" fill="url(#win)"/>
      <rect x="70" y="90" width="130" height="80"/><path d="M70 90 L135 50 L200 90Z"/>
      <rect x="90" y="115" width="22" height="26" fill="url(#win)"/><rect x="150" y="115" width="22" height="26" fill="url(#win)"/>
    </g>
    <g transform="translate(1140 500)">
      <path d="M0 30 L38 0 L76 30 V86 H0Z"/><rect x="0" y="30" width="76" height="56"/>
      <rect x="12" y="46" width="14" height="18" fill="url(#win)"/><rect x="48" y="46" width="14" height="18" fill="url(#win)"/>
    </g>
    <g transform="translate(1280 480)">
      <path d="M0 40 L50 0 L100 40 V110 H0Z"/><rect x="0" y="40" width="100" height="70"/>
      <rect x="16" y="60" width="20" height="22" fill="url(#win)"/><rect x="64" y="60" width="20" height="22" fill="url(#win)"/>
      <rect x="70" y="8" width="10" height="26" fill="#2B1B12"/>
    </g>
  </g>
  <!-- 煙突からの湯気（あたたかさ） -->
  <g fill="#FFF" opacity=".35">
    <ellipse cx="247" cy="462" rx="10" ry="6"/><ellipse cx="256" cy="446" rx="13" ry="7"/><ellipse cx="268" cy="428" rx="16" ry="8"/>
    <ellipse cx="1355" cy="474" rx="10" ry="6"/><ellipse cx="1365" cy="458" rx="13" ry="7"/><ellipse cx="1378" cy="440" rx="16" ry="8"/>
  </g>
  <!-- 針葉樹 -->
  <g fill="#2E2318">
    <path d="M60 560 L85 500 L110 560Z M70 590 L85 540 L100 590Z"/><rect x="82" y="585" width="6" height="20"/>
    <path d="M1470 545 L1495 485 L1520 545Z M1480 575 L1495 525 L1510 575Z"/><rect x="1492" y="570" width="6" height="20"/>
    <path d="M800 570 L820 520 L840 570Z"/><rect x="817" y="565" width="6" height="16"/>
  </g>
  <!-- 近景の雪原 -->
  <path d="M0 620 C260 580 480 615 720 595 S1120 565 1360 600 S1520 620 1600 600 V700 H0Z" fill="url(#snowNear)"/>
  <!-- 雪 -->
  <g fill="#FFF" opacity=".75">
    <circle cx="120" cy="120" r="3"/><circle cx="260" cy="210" r="2.5"/><circle cx="420" cy="90" r="2"/><circle cx="640" cy="180" r="3"/>
    <circle cx="780" cy="60" r="2.2"/><circle cx="960" cy="150" r="2.6"/><circle cx="1320" cy="110" r="2.4"/><circle cx="1500" cy="220" r="3"/>
    <circle cx="200" cy="330" r="2.2"/><circle cx="520" cy="290" r="2.4"/><circle cx="1060" cy="250" r="2"/><circle cx="1440" cy="300" r="2.5"/>
  </g>
</svg>
