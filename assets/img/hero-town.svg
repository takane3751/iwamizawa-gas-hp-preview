<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="冬の朝の岩見沢。雪原の向こうに山並み、列車が走り、家々に明かりが灯る。">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9DCE4"/>
      <stop offset=".45" stop-color="#E9E6E0"/>
      <stop offset=".72" stop-color="#F7DCC6"/>
      <stop offset="1" stop-color="#F6C9A6"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF6EC"/>
      <stop offset=".35" stop-color="#FFE4CB" stop-opacity=".95"/>
      <stop offset="1" stop-color="#F8C9A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtFar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#AFC3CD"/><stop offset="1" stop-color="#CAD7DD"/></linearGradient>
    <linearGradient id="mtNear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93AEBB"/><stop offset="1" stop-color="#BACBD3"/></linearGradient>
    <linearGradient id="snow1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F7F8"/><stop offset="1" stop-color="#E2EAEE"/></linearGradient>
    <linearGradient id="snow2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF0F3"/></linearGradient>
    <linearGradient id="snow3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F7"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD9A0"/><stop offset="1" stop-color="#F29A4A"/></linearGradient>
    <linearGradient id="holder" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#E4EAEC"/><stop offset="1" stop-color="#C8D3D8"/></linearGradient>
    <linearGradient id="train" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A6550"/><stop offset="1" stop-color="#0F4C3A"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- 空 -->
  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="820" cy="470" r="230" fill="url(#sun)"/>
  <circle cx="820" cy="470" r="46" fill="#FFF8F0" opacity=".9"/>
  <!-- うす雲 -->
  <g fill="#FFFFFF" opacity=".45" filter="url(#soft)">
    <ellipse cx="260" cy="210" rx="170" ry="22"/>
    <ellipse cx="980" cy="260" rx="200" ry="20"/>
    <ellipse cx="620" cy="160" rx="120" ry="14"/>
  </g>

  <!-- 遠景の山並み（夕張山地のイメージ） -->
  <path d="M0 520 L90 470 L170 495 L260 430 L330 470 L420 440 L520 480 L610 450 L700 485 L800 455 L900 490 L1000 445 L1100 480 L1200 455 V600 H0Z" fill="url(#mtFar)"/>
  <path d="M260 430 L285 445 L272 452 L300 462 L330 470 L298 470 L268 458 L240 458Z M1000 445 L1028 462 L1012 466 L1045 470 L1100 480 L1040 482 L1005 470 L975 468Z" fill="#E9F0F3" opacity=".9"/>
  <path d="M0 560 C120 520 220 545 340 515 S560 540 680 520 S900 500 1020 530 S1150 520 1200 512 V640 H0Z" fill="url(#mtNear)" opacity=".75"/>

  <!-- 雪原（奥） -->
  <path d="M0 600 C200 570 360 595 560 580 S900 560 1200 585 V900 H0Z" fill="url(#snow1)"/>

  <!-- 球形ガスホルダー -->
  <g transform="translate(870 452)">
    <g stroke="#9DB0B8" stroke-width="5" stroke-linecap="round">
      <line x1="-46" y1="40" x2="-56" y2="118"/><line x1="46" y1="40" x2="56" y2="118"/>
      <line x1="-16" y1="54" x2="-20" y2="118"/><line x1="16" y1="54" x2="20" y2="118"/>
    </g>
    <circle cx="0" cy="20" r="64" fill="url(#holder)"/>
    <path d="M-63 30 A64 64 0 0 0 63 30" fill="none" stroke="#0F4C3A" stroke-width="7" opacity=".85"/>
    <path d="M-64 22 A64 64 0 0 0 64 22" fill="none" stroke="#E5732B" stroke-width="3" opacity=".9"/>
    <path d="M-30 -30 A64 64 0 0 1 20 -42" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".9"/>
  </g>

  <!-- サイロと納屋（農業のまち） -->
  <g transform="translate(150 470)">
    <rect x="0" y="40" width="54" height="120" rx="4" fill="#E8EEF0"/>
    <path d="M0 42 A27 27 0 0 1 54 42Z" fill="#0F4C3A"/>
    <rect x="66" y="92" width="120" height="68" fill="#F6F8F9"/>
    <path d="M60 96 L126 56 L192 96Z" fill="#B9541A"/>
    <path d="M60 96 L126 56 L192 96" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
    <rect x="112" y="116" width="28" height="44" fill="#C9D5DA"/>
  </g>

  <!-- 線路と列車（鉄道のまち） -->
  <path d="M0 604 C300 592 700 590 1200 584" stroke="#A9BAC2" stroke-width="3" fill="none"/>
  <path d="M0 611 C300 599 700 597 1200 591" stroke="#C7D3D9" stroke-width="2" fill="none"/>
  <g transform="translate(360 546)">
    <rect x="0" y="0" width="300" height="46" rx="16" fill="url(#train)"/>
    <path d="M300 10 Q332 14 336 38 Q336 46 326 46 H296Z" fill="#0F4C3A"/>
    <rect x="0" y="30" width="330" height="5" fill="#E5732B"/>
    <g fill="#DCEFF2" opacity=".95">
      <rect x="20" y="10" width="34" height="14" rx="4"/><rect x="66" y="10" width="34" height="14" rx="4"/><rect x="112" y="10" width="34" height="14" rx="4"/>
      <rect x="168" y="10" width="34" height="14" rx="4"/><rect x="214" y="10" width="34" height="14" rx="4"/><rect x="262" y="10" width="26" height="14" rx="4"/>
      <path d="M302 14 Q322 17 326 30 H304Z"/>
    </g>
    <line x1="152" y1="0" x2="152" y2="46" stroke="#0A3529" stroke-width="2" opacity=".6"/>
  </g>

  <!-- 雪原（中） -->
  <path d="M0 700 C220 668 420 690 620 676 S1000 652 1200 676 V900 H0Z" fill="url(#snow2)"/>

  <!-- まちの家並み -->
  <g>
    <!-- 家1 -->
    <g transform="translate(470 610)">
      <rect x="0" y="44" width="120" height="86" fill="#FFFFFF"/>
      <path d="M-8 50 L60 4 L128 50Z" fill="#0F4C3A"/>
      <path d="M-8 50 L60 4 L128 50" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
      <rect x="18" y="68" width="26" height="26" rx="3" fill="url(#win)"/><rect x="76" y="68" width="26" height="26" rx="3" fill="url(#win)"/>
      <rect x="86" y="8" width="12" height="28" fill="#0A3529"/>
    </g>
    <!-- 家2 -->
    <g transform="translate(618 636)">
      <rect x="0" y="34" width="96" height="70" fill="#F4F7F8"/>
      <path d="M-6 40 L48 2 L102 40Z" fill="#B9541A"/>
      <path d="M-6 40 L48 2 L102 40" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
      <rect x="16" y="54" width="22" height="22" rx="3" fill="url(#win)"/><rect x="58" y="54" width="22" height="22" rx="3" fill="url(#win)"/>
    </g>
    <!-- 家3（フラット屋根の集合住宅） -->
    <g transform="translate(740 600)">
      <rect x="0" y="0" width="150" height="140" rx="4" fill="#FFFFFF"/>
      <rect x="0" y="0" width="150" height="14" fill="#1A6550"/>
      <g fill="url(#win)">
        <rect x="16" y="30" width="22" height="18" rx="2"/><rect x="64" y="30" width="22" height="18" rx="2"/><rect x="112" y="30" width="22" height="18" rx="2"/>
        <rect x="16" y="66" width="22" height="18" rx="2"/><rect x="112" y="66" width="22" height="18" rx="2"/>
        <rect x="64" y="102" width="22" height="18" rx="2"/>
      </g>
      <g fill="#D6E0E4"><rect x="64" y="66" width="22" height="18" rx="2"/><rect x="16" y="102" width="22" height="18" rx="2"/><rect x="112" y="102" width="22" height="18" rx="2"/></g>
    </g>
    <!-- 家4 -->
    <g transform="translate(320 650)">
      <rect x="0" y="34" width="100" height="74" fill="#FFFFFF"/>
      <path d="M-6 40 L50 0 L106 40Z" fill="#2F8068"/>
      <path d="M-6 40 L50 0 L106 40" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
      <rect x="38" y="58" width="24" height="24" rx="3" fill="url(#win)"/>
      <rect x="18" y="6" width="11" height="24" fill="#0A3529"/>
    </g>
    <!-- 家5 -->
    <g transform="translate(920 650)">
      <rect x="0" y="30" width="110" height="80" fill="#F7F9FA"/>
      <path d="M-6 36 L55 -4 L116 36Z" fill="#0F4C3A"/>
      <path d="M-6 36 L55 -4 L116 36" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
      <rect x="16" y="52" width="24" height="24" rx="3" fill="url(#win)"/><rect x="70" y="52" width="24" height="24" rx="3" fill="url(#win)"/>
      <rect x="80" y="2" width="11" height="22" fill="#0A3529"/>
    </g>
  </g>

  <!-- 煙突からの湯気 -->
  <g fill="#FFFFFF" opacity=".85">
    <circle cx="562" cy="604" r="9"/><circle cx="572" cy="586" r="12"/><circle cx="586" cy="564" r="15"/><circle cx="604" cy="540" r="17" opacity=".7"/>
    <circle cx="344" cy="644" r="8"/><circle cx="352" cy="628" r="11"/><circle cx="364" cy="608" r="13"/>
    <circle cx="1006" cy="640" r="8"/><circle cx="1014" cy="624" r="11"/><circle cx="1026" cy="604" r="13"/>
  </g>

  <!-- 針葉樹 -->
  <g>
    <g transform="translate(250 700)"><path d="M0 0 L26 -70 L52 0Z" fill="#1A6550"/><path d="M8 -28 L26 -70 L44 -28 Q26 -20 8 -28Z" fill="#FFFFFF" opacity=".85"/><rect x="23" y="0" width="6" height="12" fill="#0A3529"/></g>
    <g transform="translate(290 710)"><path d="M0 0 L20 -54 L40 0Z" fill="#0F4C3A"/><rect x="17" y="0" width="6" height="10" fill="#0A3529"/></g>
    <g transform="translate(1060 700)"><path d="M0 0 L28 -78 L56 0Z" fill="#0F4C3A"/><path d="M9 -32 L28 -78 L47 -32 Q28 -24 9 -32Z" fill="#FFFFFF" opacity=".85"/><rect x="25" y="0" width="6" height="12" fill="#0A3529"/></g>
    <g transform="translate(1110 714)"><path d="M0 0 L20 -52 L40 0Z" fill="#1A6550"/><rect x="17" y="0" width="6" height="10" fill="#0A3529"/></g>
    <g transform="translate(690 742)"><path d="M0 0 L16 -44 L32 0Z" fill="#2F8068"/><rect x="13" y="0" width="6" height="8" fill="#0A3529"/></g>
  </g>

  <!-- 雪原（手前） -->
  <path d="M0 770 C240 730 500 760 760 744 S1080 720 1200 742 V900 H0Z" fill="url(#snow3)"/>
  <path d="M0 830 C300 800 640 826 900 812 S1140 800 1200 806 V900 H0Z" fill="#FFFFFF"/>

  <!-- 舞う雪 -->
  <g fill="#FFFFFF" opacity=".9">
    <circle cx="110" cy="140" r="3"/><circle cx="240" cy="330" r="2.4"/><circle cx="380" cy="110" r="2"/><circle cx="520" cy="270" r="2.8"/>
    <circle cx="660" cy="90" r="2"/><circle cx="720" cy="330" r="2.4"/><circle cx="1040" cy="150" r="2.6"/><circle cx="1140" cy="320" r="2.2"/>
    <circle cx="80" cy="420" r="2.2"/><circle cx="460" cy="400" r="1.8"/><circle cx="1100" cy="420" r="2"/><circle cx="300" cy="230" r="1.8"/>
  </g>
</svg>
